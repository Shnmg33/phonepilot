plugins { id 'com.android.application' }
android {
    namespace 'com.phonepilot.bridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.phonepilot.bridge'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
